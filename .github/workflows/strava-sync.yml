# Daily at noon Eastern: pull runs from Strava into run_miles.json and commit it if it changed.
# The push triggers a Vercel deploy. Needs repo secrets STRAVA_CLIENT_ID,
# STRAVA_CLIENT_SECRET and STRAVA_REFRESH_TOKEN (Settings → Secrets and
# variables → Actions).
name: Sync Strava runs

on:
  # Noon Eastern. Cron is UTC, so fire at both 16:00 (EDT) and 17:00 (EST) and
  # let the check job skip whichever one isn't noon in New York.
  schedule:
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strava-sync
  cancel-in-progress: false

jobs:
  # Decides whether this run should sync; manual runs always do.
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.noon.outputs.run }}
    steps:
      - name: Check it's noon in New York
        id: noon
        run: |
          hour=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" != "12" ]; then
            echo "It's ${hour}:xx in New York; the other scheduled run handles noon."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The scripts only use Node built-ins, so no npm install.
      - name: Sync runs
        run: node scripts/strava-sync.mjs
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}

      - name: Commit if changed
        run: |
          if git diff --quiet run_miles.json; then
            echo "No new runs."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run_miles.json
          git commit -m "Sync runs from Strava"
          git push
